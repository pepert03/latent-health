[project]
name = "latenthealth"
version = "0.1.0"
description = "Detección precoz del riesgo cardio-renal-metabólico en atención primaria a partir de la orina y la historia clínica"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latenthealth"]

[tool.uv]
# En este equipo los hardlinks de uv fallan (os error 396).
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
